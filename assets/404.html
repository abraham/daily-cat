<!doctype html>
<html>

      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />

      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1e1e1e"

      <div class="footer">
        <a
          href="https://github.com/abraham/daily-cat"
