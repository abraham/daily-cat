version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - '/'
      - '/functions'
    schedule:
      interval: weekly
    ignore:
      # @rollup/plugin-typescript needs the TypeScript JS API, which TS 7 removed.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      vitest:
        patterns:
          - '*vitest*'
      firebase:
        patterns:
          - '*firebase*'
      typescript:
        patterns:
          - '*typescript*'
      node:
        patterns:
          - '*node*'
